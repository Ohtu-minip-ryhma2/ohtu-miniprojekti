name: Rakennus Windowsilla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync
      - name: Build exe
        run: uv run pyinstaller --onefile --name viitteet src/index.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: viitteet-windows
          path: dist/viitteet.exe
