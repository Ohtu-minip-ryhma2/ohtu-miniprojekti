[project]
name = "ohtu-miniprojekti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeremias Kalmari", email = "jeremias.jt.kalmari@student.jyu.fi" }
    ,{ name = "Miika Brigatti", email = "mimabrig@student.jyu.fi" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ohtu-miniprojekti = "ohtu_miniprojekti:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "pybtex>=0.26.1",
    "pyinstaller>=6.22.3",
    "pylint>=4.1.4",
    "pytest>=9.2.0",
    "robotcode>=2.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
